<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>ورود به پنل مدیریت</title>
    <script src="/assets/js/tailwind.js"></script>
    <script src="/assets/admin/tw-config.js"></script>
    <link rel="stylesheet" href="/assets/css/fontawesome.css" />
    <link rel="stylesheet" href="/assets/admin/admin.css" />
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50/30 text-gray-800 min-h-screen flex items-center justify-center font-vazir p-4">

    <main class="w-full max-w-sm">
        <div class="bg-white/90 backdrop-blur-xl rounded-2xl shadow-xl shadow-indigo-100/40 border border-gray-200/60 p-6 md:p-8">

            <div class="flex flex-col items-center gap-2 mb-6">
                <div class="w-12 h-12 bg-gradient-to-l from-indigo-600 to-indigo-500 rounded-2xl flex items-center justify-center shadow-md shadow-indigo-200/50">
                    <i class="fas fa-crown text-amber-300"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight">ورود به پنل مدیریت</h1>
                <p class="text-xs text-gray-400">فقط حساب‌های با نقش ادمین</p>
            </div>

            <form id="login-form" class="space-y-4" autocomplete="on">
                <div class="flex flex-col gap-1.5">
                    <label for="identifier" class="text-xs font-bold text-gray-600">ایمیل یا شماره موبایل</label>
                    <div class="relative">
                        <input id="identifier" name="identifier" type="text" required autocomplete="username"
                            class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200/60 focus:outline-none focus:ring-2 focus:ring-indigo-400/30 focus:border-indigo-400 text-sm text-gray-700 placeholder:text-gray-400 transition"
                            placeholder="admin@example.com یا 09123456789">
                        <i class="fas fa-user absolute left-3 top-3.5 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="password" class="text-xs font-bold text-gray-600">رمز عبور</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" required autocomplete="current-password"
                            class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200/60 focus:outline-none focus:ring-2 focus:ring-indigo-400/30 focus:border-indigo-400 text-sm text-gray-700 placeholder:text-gray-400 transition"
                            placeholder="••••••••">
                        <i class="fas fa-lock absolute left-3 top-3.5 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <p id="login-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200/60 rounded-xl px-3 py-2.5"></p>

                <button id="login-submit" type="submit"
                    class="w-full bg-gradient-to-l from-indigo-600 to-indigo-500 hover:from-indigo-700 hover:to-indigo-600 transition text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-md shadow-indigo-200/40 flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>ورود</span>
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-gray-400 mt-4">
            برای ساخت اولین ادمین: <code class="bg-gray-100 px-1.5 py-0.5 rounded">npm run create-admin</code>
        </p>
    </main>

    <script src="/assets/admin/login.js"></script>
</body>
</html>
